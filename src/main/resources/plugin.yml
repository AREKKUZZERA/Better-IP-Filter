name: Better-IP-Filter
version: 1.3.0
main: betteripfilter.BetterIpFilterPlugin
api-version: "1.21"
description: Whitelist players by IPv4 address, CIDR range, or IP range.

commands:
  ipf:
    description: Manage Better-IP-Filter whitelist and settings
    usage: /ipf <add|remove|list|status|reload|on|off>
    permission: betteripfilter.admin

permissions:
  betteripfilter.admin:
    description: Full access to Better-IP-Filter
    default: op
    children:
      betteripfilter.add: true
      betteripfilter.remove: true
      betteripfilter.list: true
      betteripfilter.status: true
      betteripfilter.reload: true
      betteripfilter.toggle: true
  betteripfilter.add:
    description: Add IPs to the whitelist
    default: op
  betteripfilter.remove:
    description: Remove IPs from the whitelist
    default: op
  betteripfilter.list:
    description: List whitelisted IPs
    default: op
  betteripfilter.status:
    description: View plugin status
    default: op
  betteripfilter.reload:
    description: Reload configuration
    default: op
  betteripfilter.toggle:
    description: Toggle filtering on or off
    default: op
